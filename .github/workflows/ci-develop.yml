name: CI - Develop

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout Maliev.Aspire
        uses: actions/checkout@v5
        with:
          repository: MALIEV-Co-Ltd/Maliev.Aspire
          path: Maliev.Aspire

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Fix MessagingContracts PackageReference
        run: |
          # Remove any duplicate MessagingContracts references
          sed -i 's|<PackageReference Include="Maliev.MessagingContracts" Version="1.0.79-alpha" />||g' Maliev.Intranet.Bff/Maliev.Intranet.Bff.csproj 2>/dev/null || true
          # Ensure MessagingContracts is present
          if ! grep -q "Maliev.MessagingContracts" Maliev.Intranet.Bff/Maliev.Intranet.Bff.csproj; then
            sed -i 's|<PackageReference Include="MudBlazor" Version="9.1.0" />|<PackageReference Include="Maliev.MessagingContracts" Version="1.0.79-alpha" />\n    <PackageReference Include="MudBlazor" Version="9.1.0" />|g' Maliev.Intranet.Bff/Maliev.Intranet.Bff.csproj
          fi
          echo "Fixed MessagingContracts reference"

      - name: Restore dependencies
        run: dotnet restore Maliev.Intranet.slnx /p:TreatWarningsAsErrors=false /p:NoWarn=NU1903
        env:
          NUGET_USERNAME: ${{ github.actor }}
          NUGET_PASSWORD: ${{ secrets.GITOPS_PAT }}

      - name: Build
        run: dotnet build Maliev.Intranet.slnx --no-restore /p:TreatWarningsAsErrors=false /p:NoWarn=NU1903

      - name: Test
        run: dotnet test Maliev.Intranet.slnx --no-build --verbosity normal /p:TreatWarningsAsErrors=false /p:NoWarn=NU1903
        working-directory: ${{ github.workspace }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: maliev-website

      - name: Build and push Docker image
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev
          NUGET_USERNAME=${{ github.actor }} \
          NUGET_PASSWORD=${{ secrets.GITOPS_PAT }} \
            docker build \
            --secret id=nuget_username,env=NUGET_USERNAME \
            --secret id=nuget_password,env=NUGET_PASSWORD \
            -t asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact-dev/maliev-intranet:${{ github.sha }} \
            -f Maliev.Intranet.Bff/Dockerfile .
          docker push asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact-dev/maliev-intranet:${{ github.sha }}

      - name: Checkout maliev-gitops repository
        uses: actions/checkout@v5
        with:
          repository: MALIEV-Co-Ltd/maliev-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: maliev-gitops

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tag in maliev-gitops using Kustomize
        run: |
          cd maliev-gitops/3-apps/maliev-intranet/overlays/development
          kustomize edit set image \
            asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact/maliev-intranet=\
          asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact-dev/maliev-intranet:${{ github.sha }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          chmod +x .github/scripts/create-gitops-pr.sh
          .github/scripts/create-gitops-pr.sh "Intranet" "Development" "${{ github.sha }}" "${{ github.ref_name }}" "${{ github.sha }}"
